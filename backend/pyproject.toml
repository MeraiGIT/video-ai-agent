[project]
name = "video-ai-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.4.0",
    "anthropic>=0.40.0",
    "fal-client>=0.5.0",
    "elevenlabs>=1.0.0",
    "faster-whisper>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[tool.setuptools]
packages = ["agent", "agent.nodes", "api", "services", "utils"]
